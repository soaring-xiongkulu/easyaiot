name: COMPILE Multi-Platform Packaging

on:
  workflow_dispatch:
    inputs:
      build_windows_installer:
        description: "Build Windows NSIS installer (needs makensis on runner)"
        required: false
        default: false
        type: boolean
      build_macos_dmg:
        description: "Build macOS .dmg package"
        required: false
        default: false
        type: boolean
      enable_centos_self_hosted:
        description: "Enable CentOS el9 rpm job"
        required: false
        default: false
        type: boolean
      enable_centos_el7:
        description: "Enable CentOS el7 rpm job"
        required: false
        default: false
        type: boolean
      enable_centos_el8:
        description: "Enable CentOS el8 rpm job"
        required: false
        default: false
        type: boolean
      enable_centos_arm:
        description: "Enable CentOS ARM64 el9 rpm job (dockerized cross-build)"
        required: false
        default: false
        type: boolean
      enable_openeuler:
        description: "Enable openEuler rpm job (dockerized)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  ubuntu-deb:
    name: Ubuntu deb
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build deb package
        run: |
          bash COMPILE/build.sh deb
          ls -lh COMPILE/dist/ubuntu

      - name: Upload ubuntu artifacts
        uses: actions/upload-artifact@v4
        with:
          name: easyaiot-panel-ubuntu
          path: |
            COMPILE/dist/ubuntu/easyaiot-panel
            COMPILE/dist/ubuntu/*.deb

  windows-exe:
    name: Windows exe
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build exe
        run: |
          bash COMPILE/build.sh windows
          ls -lh COMPILE/dist/windows

      - name: Upload windows exe artifacts
        uses: actions/upload-artifact@v4
        with:
          name: easyaiot-panel-windows-exe
          path: |
            COMPILE/dist/windows/easyaiot-panel.exe
            COMPILE/dist/windows/panel.env
            COMPILE/dist/windows/panel.env.example
            COMPILE/dist/windows/run.bat
            COMPILE/dist/windows/README.txt
            COMPILE/dist/windows/runtime

  windows-installer:
    name: Windows installer (optional)
    if: ${{ inputs.build_windows_installer }}
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install NSIS
        run: choco install nsis -y

      - name: Build windows installer
        run: |
          bash COMPILE/build.sh windows --installer
          ls -lh COMPILE/dist/windows

      - name: Upload windows installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: easyaiot-panel-windows-installer
          path: COMPILE/dist/windows/*setup.exe

  macos-bin:
    name: macOS binary
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build macOS binary
        run: |
          bash COMPILE/build.sh macos
          ls -lh COMPILE/dist/macos

      - name: Upload macOS binary artifacts
        uses: actions/upload-artifact@v4
        with:
          name: easyaiot-panel-macos-bin
          path: |
            COMPILE/dist/macos/easyaiot-panel
            COMPILE/dist/macos/panel.env
            COMPILE/dist/macos/panel.env.example
            COMPILE/dist/macos/run.command
            COMPILE/dist/macos/README.txt
            COMPILE/dist/macos/runtime

  macos-dmg:
    name: macOS dmg (optional)
    if: ${{ inputs.build_macos_dmg }}
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build macOS dmg
        run: |
          bash COMPILE/build.sh macos --dmg
          ls -lh COMPILE/dist/macos

      - name: Upload macOS dmg artifacts
        uses: actions/upload-artifact@v4
        with:
          name: easyaiot-panel-macos-dmg
          path: |
            COMPILE/dist/macos/*.dmg
            COMPILE/dist/macos/*.app/**

  centos-rpm:
    name: CentOS/RHEL el9 rpm
    if: ${{ inputs.enable_centos_self_hosted }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build centos-el9 rpm (dockerized)
        run: |
          bash COMPILE/build.sh centos-el9 --docker
          ls -lh COMPILE/dist/centos-el9

      - name: Upload centos-el9 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: easyaiot-panel-centos-el9
          path: |
            COMPILE/dist/centos-el9/easyaiot-panel
            COMPILE/dist/centos-el9/*.rpm

  centos-el8-rpm:
    name: CentOS/RHEL el8 rpm
    if: ${{ inputs.enable_centos_el8 }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build centos-el8 rpm (dockerized)
        run: |
          bash COMPILE/build.sh centos-el8 --docker
          ls -lh COMPILE/dist/centos-el8

      - name: Upload centos-el8 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: easyaiot-panel-centos-el8
          path: |
            COMPILE/dist/centos-el8/easyaiot-panel
            COMPILE/dist/centos-el8/*.rpm

  centos-el7-rpm:
    name: CentOS/RHEL el7 rpm
    if: ${{ inputs.enable_centos_el7 }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build centos-el7 rpm (dockerized)
        run: |
          bash COMPILE/build.sh centos-el7 --docker
          ls -lh COMPILE/dist/centos-el7

      - name: Upload centos-el7 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: easyaiot-panel-centos-el7
          path: |
            COMPILE/dist/centos-el7/easyaiot-panel
            COMPILE/dist/centos-el7/*.rpm

  centos-arm-rpm:
    name: CentOS/RHEL ARM64 el9 rpm (cross-build)
    if: ${{ inputs.enable_centos_arm }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build centos-arm-el9 rpm (dockerized linux/arm64)
        run: |
          bash COMPILE/build.sh centos-arm-el9 --docker
          ls -lh COMPILE/dist/centos-arm-el9

      - name: Upload centos-arm-el9 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: easyaiot-panel-centos-arm-el9
          path: |
            COMPILE/dist/centos-arm-el9/easyaiot-panel
            COMPILE/dist/centos-arm-el9/*.rpm

  openeuler-rpm:
    name: openEuler rpm (containerized optional)
    if: ${{ inputs.enable_openeuler }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build openEuler rpm (dockerized)
        run: |
          bash COMPILE/build.sh openeuler --docker
          ls -lh COMPILE/dist/openeuler

      - name: Upload openEuler artifacts
        uses: actions/upload-artifact@v4
        with:
          name: easyaiot-panel-openeuler
          path: |
            COMPILE/dist/openeuler/easyaiot-panel
            COMPILE/dist/openeuler/*.rpm
