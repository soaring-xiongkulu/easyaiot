# RUNTIME 模块配置文件示例（由 VIDEO executor=cpp 生成或手工复制）
# 复制后按现场修改；VIDEO 会写入 config/task_{id}.ini

# ============================================
# 视频流配置
# ============================================
[video]
rtsp_url=rtsp://admin:password@192.168.1.64:554/Streaming/Channels/101
rtmp_url=rtmp://localhost:1935/live/stream_123
width=1920
height=1080
fps=25
# 推流码率（可选）。不填则按编码分辨率自动：720p≈3500k / 1080p≈4500k / 更高更大
# bitrate=4500k
# gop=50

# ============================================
# AI 推理
# ============================================
# AI 推理（Ultralytics YOLO detect ONNX；也可用 .pt，启动时自动导出）
# 支持 YOLOv8 / YOLO11 classic detect，以及 YOLO26 end2end（输出 [N,6]）
# 自定义模型：指向 .onnx 或 .pt；classes_path 为一行一类的 .names
# 多模型：主模型写 model_path/classes_path，其余按 model_path_<key>/classes_path_<key>
# 追加（如 model_path_1、model_path_2）；每帧全部模型推理并按模型聚合结果，
# 告警事件中每条 detection 携带 model_id（0=主模型，1=model_path_1，以此类推）
[ai]
enable=true
model_path=/path/to/yolo11n.onnx
classes_path=/path/to/coco.names
threads=2
# 默认 prefer GPU（ORT CUDA EP）；失败自动回退 CPU。force_cpu=true 时仅 CPU
prefer_gpu=true
force_cpu=false
gpu_device_id=0
# FFmpeg NVDEC 硬解 + NVENC 硬编（失败回退软解/libx264）
# prefer_gpu=false / force_cpu=true 时会强制 soft_av
prefer_hwaccel=true
force_soft_av=false
hwaccel_device_id=0
nvenc_preset=p3

# ============================================
# 告警（事件走 MQTT → iot-sink；见 [mqtt] / video_task.mqtt_*）
# 纯边缘（standalone）形态不部署 EMQX，VIDEO 生成 ini 时强制
# algo_bus_transport=http，告警走 alert_hook_url → 本机 VIDEO /video/alert/hook
# ============================================
[alarm]
enable=true
confidence_threshold=0.5
cooldown_time=30
image_dir=/var/log/easyaiot/runtime/task_123/alerts

# ============================================
# 任务控制口（必须 8000–9000，与 VIDEO runtime_control_port 一致）
# ============================================
[task]
id=123
control_port=8123

# ============================================
# VIDEO 平台对接（启停/心跳 HTTP；告警 MQTT）
# task_type: realtime | snap | patrol | forward
#   forward = RTSP->RTMP 直通（无 AI），见 config/forward.example.ini
# ============================================
[video_task]
device_id=camera_001
device_name=门口摄像头
task_type=realtime
algorithm_name=detection
heartbeat_url=http://127.0.0.1:6000/video/algorithm/heartbeat/realtime
heartbeat_interval_sec=10
log_path=/var/log/easyaiot/runtime/task_123
alert_image_dir=/var/log/easyaiot/runtime/task_123/alerts
# 边缘计算节点标识（compute_node_id 或环境变量 NODE_ID/COMPUTE_NODE_ID 二选一）：
# 心跳与 MQTT 告警据此归属执行节点；远程部署时 VIDEO 会自动写入目标节点 id
# compute_node_id=7
# 人脸/车牌库匹配链路桥：MQTT 告警路径下额外向 alert_hook_url 投递
# face_feed_only / plate_feed_only 告警，由 VIDEO /video/alert/hook 送入抓取匹配队列
face_matching_enabled=false
plate_matching_enabled=false
# 告警总线：mqtt（默认，经 mqtt_broker_urls → EMQX → iot-sink）| http（经 alert_hook_url → VIDEO /video/alert/hook）
# 云边一体远程部署时，VIDEO 会把 mqtt_broker_urls 重写为控制面可达地址，勿手改成 127.0.0.1
# 纯边缘（standalone）形态由 VIDEO 强制 http，本节 mqtt_* 项不生效
algo_bus_transport=mqtt
mqtt_broker_urls=127.0.0.1:1883
mqtt_tenant=default
headless=true

[mqtt]
broker_urls=127.0.0.1:1883
tenant=default
transport=mqtt

# ============================================
# 功能开关
# ============================================
[features]
enable_rtmp=false
enable_draw=true
enable_alarm=true

# ============================================
# 报警区域（可选；不配则全画面）
# ============================================
[regions]
# area_1=[[100,200],[500,200],[500,600],[100,600]]
