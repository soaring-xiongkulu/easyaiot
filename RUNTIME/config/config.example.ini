# RUNTIME 模块配置文件示例（由 VIDEO executor=cpp 生成或手工复制）
# 复制后按现场修改；VIDEO 会写入 config/task_{id}.ini

# ============================================
# 视频流配置
# ============================================
[video]
rtsp_url=rtsp://admin:password@192.168.1.64:554/Streaming/Channels/101
rtmp_url=rtmp://localhost:1935/live/stream_123
width=1920
height=1080
fps=25

# ============================================
# AI 推理
# ============================================
[ai]
enable=true
model_path=/path/to/yolov11n.onnx
classes_path=/path/to/coco.names
threads=2
# 默认 prefer GPU（ORT CUDA EP）；失败自动回退 CPU。force_cpu=true 时仅 CPU
prefer_gpu=true
force_cpu=false
gpu_device_id=0

# ============================================
# 告警（兼容旧 hook_url；优先用 video_task.alert_hook_url）
# ============================================
[alarm]
enable=true
hook_url=http://127.0.0.1:6000/video/alert/hook
confidence_threshold=0.5
cooldown_time=30

# ============================================
# 任务控制口
# ============================================
[task]
id=123
control_port=8123

# ============================================
# VIDEO 平台对接（必填以打通启停/心跳/告警）
# ============================================
[video_task]
device_id=camera_001
device_name=门口摄像头
task_type=realtime
algorithm_name=detection
alert_hook_url=http://127.0.0.1:6000/video/alert/hook
heartbeat_url=http://127.0.0.1:6000/video/algorithm/heartbeat/realtime
heartbeat_interval_sec=10
log_path=/var/log/easyaiot/runtime/task_123
headless=true

# ============================================
# 功能开关
# ============================================
[features]
enable_rtmp=false
enable_draw=true
enable_alarm=true

# ============================================
# 报警区域（可选；不配则全画面）
# ============================================
[regions]
# area_1=[[100,200],[500,200],[500,600],[100,600]]

# ============================================
# Phase 2 契约段（VIDEO generate_runtime_ini 写入）
# ============================================
[tracking]
enabled=false
similarity_threshold=0.2
max_age=25
smooth_alpha=0.25

[motion_gate]
enabled=false
config_json={}

[alert_filter]
alert_class_names=[]
face_detection_enabled=true
plate_detection_enabled=true

[hook]
# G-2.2: cpp 告警 JSON 透传（与 python run_deploy 对齐）
face_detection_enabled=true
plate_detection_enabled=true

[matching]
face_matching_enabled=false
plate_matching_enabled=false
face_library_ids=[]
plate_library_ids=[]
face_matching_threshold=
matching_business_tags=[]

[post_process]
enabled=false
script=post_process.py
replicas=1

[pose]
analysis_enabled=false
analysis_config_json={}
intent_enabled=false
library_ids=[]
intent_threshold=
intent_config_json={}

[sam]
supplement_enabled=false

[defense]
mode=half
schedule_json={}

[patrol_extra]
focus_device_id=

[models]
extra_paths=[]

# enabled CAP id → true：C++ 启动时 LOG(WARNING) + GET /health unsupported_caps
[unsupported]
# CAP-TRACKING=true
