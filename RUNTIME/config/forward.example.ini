# RUNTIME forward-only：RTSP -> RTMP 直通（无 YOLO / 无解码 / 无转码）
# 用途：替代 ffmpeg copy 推流转发，CPU 占用更低、与 realtime 共用控制口/心跳

[video]
rtsp_url=rtsp://admin:password@192.168.1.64:554/Streaming/Channels/102
rtmp_url=rtmp://127.0.0.1:1935/live/camera_001

[task]
id=forward_001
control_port=8124

[video_task]
device_id=camera_001
device_name=门口摄像头
task_type=forward
heartbeat_url=http://127.0.0.1:6000/video/stream-forward/heartbeat
heartbeat_interval_sec=10
log_path=/var/log/easyaiot/runtime/forward_001
headless=true

[features]
enable_rtmp=true
enable_draw=false
enable_alarm=false

[ai]
enable=false
