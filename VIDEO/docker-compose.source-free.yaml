# PANEL / COMPILE 无源码 runtime：预构建镜像已含应用，禁止再挂 ./:/app（会盖掉镜像内代码）
# 由 install_linux.sh 在检测到 .source_free_runtime 或缺少 docker-entrypoint.sh 时自动叠加
services:
  video-service:
    entrypoint: !reset null
    command: !reset null
    volumes: !override
      - ./data:/app/data
      - ./static:/app/static
      - ./temp_uploads:/app/temp_uploads
      - ./model:/app/model
      - ./alert_images:/app/alert_images
      - ~/easyaiot/data:/data:rw
      - ./.env.docker:/app/.env:ro
