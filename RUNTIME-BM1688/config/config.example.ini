# RUNTIME-BM1688 单路任务示例；VIDEO 创建任务时会自动生成同一契约。
[video]
rtsp_url=rtsp://user:password@camera/stream
rtmp_url=
width=1920
height=1080
fps=25

[ai]
enable=true
model_path=/opt/easyaiot/RUNTIME-BM1688/models/yolov8n-bm1688-int8-4b.bmodel
classes_path=/opt/easyaiot/RUNTIME-BM1688/models/coco.names
model_id=-2
threads=2
frame_skip=1
nms_threshold=0.45

[bm1688]
device_id=0
tpu_workers=2
core_ids=0,1
decode_queue_depth=8
infer_queue_depth=4
result_queue_depth=64
preallocate=true
zero_copy=true
use_vpp=true
decoder=h264_bm,hevc_bm

[alarm]
enable=true
confidence_threshold=0.5
cooldown_time=30
alert_hook_url=http://127.0.0.1:8010/video/alert/hook
image_dir=/var/lib/easyaiot/runtime-bm1688/alerts

[task]
id=1
control_port=8001

[video_task]
device_id=bm1688-camera-001
device_name=BM1688摄像头
task_type=realtime
algorithm_name=yolov8
heartbeat_url=http://127.0.0.1:8010/video/algorithm/heartbeat/realtime
heartbeat_interval_sec=10
log_path=/var/log/easyaiot/runtime-bm1688/task_1
alert_image_dir=/var/lib/easyaiot/runtime-bm1688/alerts
algo_bus_transport=http

[mqtt]
broker_urls=127.0.0.1:1883
username=
password=
client_id=runtime-bm1688
tenant=default
transport=http

[features]
enable_rtmp=false
enable_draw=true
enable_alarm=true
