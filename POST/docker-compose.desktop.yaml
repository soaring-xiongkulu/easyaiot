# Docker Desktop (Windows / macOS) override
# network_mode: host 在 Desktop 上不会把端口暴露到宿主机，改为 bridge + 端口映射。
services:
  post-service:
    network_mode: !reset null
    ports:
      - "${POST_HOST_PORT:-8089}:8089"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - MQTT_BROKER=${MQTT_BROKER:-tcp://host.docker.internal:1883}
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:iot45722414822@host.docker.internal:5432/iot-video20}
      - NACOS_SERVER=${NACOS_SERVER:-host.docker.internal:8848}
      - POST_HTTP_ADDR=${POST_HTTP_ADDR:-:8089}
    networks:
      - easyaiot-network

networks:
  easyaiot-network:
    name: easyaiot-network
    external: true
