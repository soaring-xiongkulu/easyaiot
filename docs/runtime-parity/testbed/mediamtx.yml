# MediaMTX paths for runtime-parity testbed.
# MP4 must exist under testdata/runtime-parity/media/ on the host.

paths:
  person_roi:
    source: publisher
    runOnDemand: ffmpeg -re -stream_loop -1 -i /media/media_person_roi_30s.mp4 -c copy -f rtsp rtsp://127.0.0.1:$RTSP_PORT/$MTX_PATH
    runOnDemandRestart: yes

  static:
    source: publisher
    runOnDemand: ffmpeg -re -stream_loop -1 -i /media/media_static_30s.mp4 -c copy -f rtsp rtsp://127.0.0.1:$RTSP_PORT/$MTX_PATH
    runOnDemandRestart: yes
