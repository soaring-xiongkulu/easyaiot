# MediaMTX paths for runtime-parity testbed.
# MP4 must exist under testdata/runtime-parity/media/ on the host.

paths:
  people:
    source: publisher
    runOnDemand: ffmpeg -re -stream_loop -1 -i /media/people-detection.mp4 -c copy -f rtsp rtsp://127.0.0.1:$RTSP_PORT/$MTX_PATH
    runOnDemandRestart: yes

  one_by_one:
    source: publisher
    runOnDemand: ffmpeg -re -stream_loop -1 -i /media/one-by-one-person-detection.mp4 -c copy -f rtsp rtsp://127.0.0.1:$RTSP_PORT/$MTX_PATH
    runOnDemandRestart: yes
