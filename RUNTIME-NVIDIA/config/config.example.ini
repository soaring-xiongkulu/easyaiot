# RUNTIME-NVIDIA 单路任务示例；多 RTSP 使用多份配置/多实例，每份配置可挂多个 engine。
[video]
rtsp_url=rtsp://user:password@camera/stream
width=1920
height=1080
fps=25

[ai]
enable=true
model_path=/opt/easyaiot/RUNTIME-NVIDIA/models/yolov8n-nvidia-fp16.engine
classes_path=/opt/easyaiot/RUNTIME-NVIDIA/models/coco.names
model_id=-2
# model_path_1=/opt/easyaiot/RUNTIME-NVIDIA/models/helmet-nvidia-fp16.engine
# classes_path_1=/opt/easyaiot/RUNTIME-NVIDIA/models/helmet.names
# model_id_1=101
frame_skip=1
nms_threshold=0.45

[nvidia]
cuda_device=0
infer_streams=2
decoder_surfaces=16
decode_queue_depth=8
infer_queue_depth=4
result_queue_depth=64
zero_copy=true
preallocate=true
cuda_graph=true
require_nvdec=true
require_nvenc=false
decoder=h264_cuvid,hevc_cuvid,av1_cuvid

[alarm]
enable=true
confidence_threshold=0.5
cooldown_time=30
alert_hook_url=http://127.0.0.1:8010/video/alert/hook

[task]
id=1
control_port=8001

[video_task]
device_id=nvidia-camera-001
device_name=NVIDIA摄像头
task_type=realtime
algorithm_name=yolov8
heartbeat_url=http://127.0.0.1:8010/video/algorithm/heartbeat/realtime
heartbeat_interval_sec=10
log_path=/var/log/easyaiot/runtime-nvidia/task_1
algo_bus_transport=http

[mqtt]
broker_urls=127.0.0.1:1883
username=
password=
client_id=runtime-nvidia
tenant=default
transport=http

[features]
enable_rtmp=false
enable_alarm=true
