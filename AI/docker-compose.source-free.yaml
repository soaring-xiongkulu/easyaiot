# PANEL / COMPILE 无源码 runtime：预构建镜像已含应用，禁止再挂 ./:/app（会盖掉镜像内代码）
# 由 install_linux.sh 在检测到 .source_free_runtime 或缺少 docker-entrypoint.sh 时自动叠加
services:
  ai-service:
    entrypoint: !reset null
    command: !reset null
    volumes: !override
      - ./data:/app/data
      - ${EASYAIOT_MEDIA_ROOT:-/mnt/easyaiot-media}:/data:rw
      - ./static:/app/static
      - ./temp_uploads:/app/temp_uploads
      - ./model:/app/model
      - ./yolo11n:/app/yolo11n
      - ./yolo11n.pt:/app/yolo11n.pt
      - ./yolov8n.pt:/app/yolov8n.pt
      - ./yolo26n.pt:/app/yolo26n.pt
      - ./yolo26n-pose.pt:/app/yolo26n-pose.pt
      - ./.env.docker:/app/.env:ro
      - ../.scripts/minio:/minio-seed-data:ro
