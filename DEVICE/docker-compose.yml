# 构建：install_linux.sh 两阶段（Dockerfile.base 一次 Maven → target/jars → 各模块 Dockerfile）
# Maven 依赖缓存：项目根 .build-cache/device/m2/repository
services:
  iot-gateway:
    image: iot-gateway:latest
    container_name: iot-gateway
    user: root
    network_mode: host # 使用host网络模式，直接使用宿主机网络
    environment:
      - TZ=Asia/Shanghai # 配置程序默认时区为上海（中国标准时间）
      - JAVA_OPTS=-Xms256m -Xmx320m
      - SPRING_PROFILES_ACTIVE=local # 指定程序运行环境
      - SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR=localhost:8848 # 配置中心地址（使用host网络模式，通过localhost访问）
      - SPRING_CLOUD_NACOS_CONFIG_NAMESPACE= # 使用默认命名空间（public）
      - SPRING_CLOUD_NACOS_SERVER_ADDR=localhost:8848 # 注册中心地址（使用host网络模式，通过localhost访问）
      - SPRING_CLOUD_NACOS_DISCOVERY_NAMESPACE= # 使用默认命名空间（public）
      # SkyWalking配置（如需要，请取消注释并配置）
      # - JAVA_TOOL_OPTIONS=-javaagent:/data/skywalking/skywalking-agent/skywalking-agent.jar
      # - SW_AGENT_NAME=iot-gateway
      # - SW_AGENT_TRACE_IGNORE_PATH=Redisson/PING,/actuator/**,/admin/**
      # - SW_AGENT_COLLECTOR_BACKEND_SERVICES=[YOUR_SKYWALKING_ADDR]
    volumes:
      - ../.build-cache/device/logs:/root/logs/
      # - /data/skywalking/skywalking-agent:/data/skywalking/skywalking-agent
    restart: always

  iot-system:
    image: iot-module-system-biz:latest
    container_name: iot-system
    user: root
    ports:
      - "0.0.0.0:48099:48099"
    environment:
      - TZ=Asia/Shanghai # 配置程序默认时区为上海（中国标准时间）
      - JAVA_OPTS=-Xms256m -Xmx320m
      - SPRING_PROFILES_ACTIVE=${IOT_SYSTEM_SPRING_PROFILES_ACTIVE:-local} # mini 形态由安装脚本设为 local,mini
      - SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR=Nacos:8848 # 配置中心地址（使用Docker服务名）
      - SPRING_CLOUD_NACOS_CONFIG_NAMESPACE= # 使用默认命名空间（public）
      - SPRING_CLOUD_NACOS_SERVER_ADDR=Nacos:8848 # 注册中心地址（使用Docker服务名）
      - SPRING_CLOUD_NACOS_DISCOVERY_NAMESPACE= # 使用默认命名空间（public）
      - SPRING_DATASOURCE_DYNAMIC_DATASOURCE_MASTER_URL=jdbc:postgresql://PostgresSQL:5432/ruoyi-vue-pro20?autoReconnect=true&autoReconnectForPools=true&useUnicode=true&characterEncoding=utf8&createDatabaseIfNotExist=true&allowMultiQueries=true&zeroDateTimeBehavior=convertToNull&stringtype=unspecified # PostgreSQL数据库地址（使用Docker服务名）
      - SPRING_REDIS_HOST=Redis # Redis地址（使用Docker服务名）
      - IOT_CAPTCHA_ENABLE=false # 本地开发关闭验证码，与 APP VITE_APP_CAPTCHA_ENABLE=false 对齐
      # SkyWalking配置（如需要，请取消注释并配置）
      # - JAVA_TOOL_OPTIONS=-javaagent:/data/skywalking/skywalking-agent/skywalking-agent.jar
      # - SW_AGENT_NAME=iot-system
      # - SW_AGENT_TRACE_IGNORE_PATH=Redisson/PING,/actuator/**,/admin/**
      # - SW_AGENT_COLLECTOR_BACKEND_SERVICES=[YOUR_SKYWALKING_ADDR]
    volumes:
      - ../.build-cache/device/logs:/root/logs/
      # - /data/skywalking/skywalking-agent:/data/skywalking/skywalking-agent
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:48099"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: always
    networks:
      easyaiot-network:
        aliases:
          - system-server

  iot-infra:
    image: iot-module-infra-biz:latest
    container_name: iot-infra
    user: root
    environment:
      - TZ=Asia/Shanghai # 配置程序默认时区为上海（中国标准时间）
      - JAVA_OPTS=-Xms256m -Xmx320m
      - SPRING_PROFILES_ACTIVE=local # 指定程序运行环境
      - SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR=Nacos:8848 # 配置中心地址（使用Docker服务名）
      - SPRING_CLOUD_NACOS_CONFIG_NAMESPACE= # 使用默认命名空间（public）
      - SPRING_CLOUD_NACOS_SERVER_ADDR=Nacos:8848 # 注册中心地址（使用Docker服务名）
      - SPRING_CLOUD_NACOS_DISCOVERY_NAMESPACE= # 使用默认命名空间（public）
      - SPRING_DATASOURCE_DYNAMIC_DATASOURCE_MASTER_URL=jdbc:postgresql://PostgresSQL:5432/ruoyi-vue-pro20?autoReconnect=true&autoReconnectForPools=true&useUnicode=true&characterEncoding=utf8&createDatabaseIfNotExist=true&allowMultiQueries=true&zeroDateTimeBehavior=convertToNull&stringtype=unspecified # PostgreSQL数据库地址（使用Docker服务名）
      - SPRING_REDIS_HOST=Redis # Redis地址（使用Docker服务名）
      - SPRING_RABBITMQ_HOST=localhost # RabbitMQ地址（如需要，请配置Docker服务名）
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=Kafka:9092 # Kafka地址（使用Docker服务名）
      # SkyWalking配置（如需要，请取消注释并配置）
      # - JAVA_TOOL_OPTIONS=-javaagent:/data/skywalking/skywalking-agent/skywalking-agent.jar
      # - SW_AGENT_NAME=iot-infra
      # - SW_AGENT_TRACE_IGNORE_PATH=Redisson/PING,/actuator/**,/admin/**
      # - SW_AGENT_COLLECTOR_BACKEND_SERVICES=[YOUR_SKYWALKING_ADDR]
    volumes:
      - ../.build-cache/device/logs:/root/logs/
      # - /data/skywalking/skywalking-agent:/data/skywalking/skywalking-agent
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:48082"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: always
    networks:
      - easyaiot-network
    depends_on:
      iot-system:
        condition: service_healthy

  iot-device:
    image: iot-module-device-biz:latest
    container_name: iot-device
    user: root
    environment:
      - TZ=Asia/Shanghai # 配置程序默认时区为上海（中国标准时间）
      - JAVA_OPTS=-Xms256m -Xmx320m
      - SPRING_PROFILES_ACTIVE=local # 指定程序运行环境
      - SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR=Nacos:8848 # 配置中心地址（使用Docker服务名）
      - SPRING_CLOUD_NACOS_CONFIG_NAMESPACE= # 使用默认命名空间（public）
      - SPRING_CLOUD_NACOS_SERVER_ADDR=Nacos:8848 # 注册中心地址（使用Docker服务名）
      - SPRING_CLOUD_NACOS_DISCOVERY_NAMESPACE= # 使用默认命名空间（public）
      - SPRING_DATASOURCE_DYNAMIC_DATASOURCE_MASTER_URL=jdbc:postgresql://PostgresSQL:5432/iot-device20?autoReconnect=true&autoReconnectForPools=true&useUnicode=true&characterEncoding=utf8&createDatabaseIfNotExist=true&allowMultiQueries=true&zeroDateTimeBehavior=convertToNull&stringtype=unspecified # PostgreSQL数据库地址（使用Docker服务名）
      - SPRING_REDIS_HOST=Redis # Redis地址（使用Docker服务名）
      - MINIO_ENDPOINT=http://MinIO:9000 # Minio地址（使用Docker服务名）
      - SPRING_KAFKA_IOT_PRODUCER_BOOTSTRAP_SERVERS=Kafka:9092 # Kafka生产者地址（使用Docker服务名）
      - SPRING_KAFKA_IOT_CONSUMER_BOOTSTRAP_SERVERS=Kafka:9092 # Kafka消费者地址（使用Docker服务名）
      # SkyWalking配置（如需要，请取消注释并配置）
      # - JAVA_TOOL_OPTIONS=-javaagent:/data/skywalking/skywalking-agent/skywalking-agent.jar
      # - SW_AGENT_NAME=iot-device
      # - SW_AGENT_TRACE_IGNORE_PATH=Redisson/PING,/actuator/**,/admin/**
      # - SW_AGENT_COLLECTOR_BACKEND_SERVICES=[YOUR_SKYWALKING_ADDR]
    volumes:
      - ../.build-cache/device/logs:/root/logs/
      # - /data/skywalking/skywalking-agent:/data/skywalking/skywalking-agent
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:48083/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: always
    networks:
      - easyaiot-network
    depends_on:
      iot-infra:
        condition: service_healthy

  iot-dataset:
    image: iot-module-dataset-biz:latest
    container_name: iot-dataset
    user: root
    environment:
      - TZ=Asia/Shanghai # 配置程序默认时区为上海（中国标准时间）
      - JAVA_OPTS=-Xms512m -Xmx2g -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/root/logs/iot-dataset-oom.hprof -XX:+ExitOnOutOfMemoryError
      - SPRING_PROFILES_ACTIVE=local # 指定程序运行环境
      - SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR=Nacos:8848 # 配置中心地址（使用Docker服务名）
      - SPRING_CLOUD_NACOS_CONFIG_NAMESPACE= # 使用默认命名空间（public）
      - SPRING_CLOUD_NACOS_SERVER_ADDR=Nacos:8848 # 注册中心地址（使用Docker服务名）
      - SPRING_CLOUD_NACOS_DISCOVERY_NAMESPACE= # 使用默认命名空间（public）
      - SPRING_DATASOURCE_DYNAMIC_DATASOURCE_MASTER_URL=jdbc:postgresql://PostgresSQL:5432/iot-device20?autoReconnect=true&autoReconnectForPools=true&useUnicode=true&characterEncoding=utf8&createDatabaseIfNotExist=true&allowMultiQueries=true&zeroDateTimeBehavior=convertToNull&stringtype=unspecified # PostgreSQL数据库地址（使用Docker服务名）
      - SPRING_REDIS_HOST=Redis # Redis地址（使用Docker服务名）
      - MINIO_ENDPOINT=http://MinIO:9000 # Minio地址（使用Docker服务名）
      - MINIO_BASE_URL=http://MinIO:9000 # Minio基础URL（使用Docker服务名）
      # SkyWalking配置（如需要，请取消注释并配置）
      # - JAVA_TOOL_OPTIONS=-javaagent:/data/skywalking/skywalking-agent/skywalking-agent.jar
      # - SW_AGENT_NAME=iot-dataset
      # - SW_AGENT_TRACE_IGNORE_PATH=Redisson/PING,/actuator/**,/admin/**
      # - SW_AGENT_COLLECTOR_BACKEND_SERVICES=[YOUR_SKYWALKING_ADDR]
    volumes:
      - ../.build-cache/device/logs:/root/logs/
      - /data/yolo_dataset:/data/yolo_dataset:ro
      # - /data/skywalking/skywalking-agent:/data/skywalking/skywalking-agent
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:48087/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: always
    networks:
      - easyaiot-network
    depends_on:
      iot-infra:
        condition: service_healthy

  iot-node:
    image: iot-module-node-biz:latest
    container_name: iot-node
    user: root
    environment:
      - TZ=Asia/Shanghai
      - JAVA_OPTS=-Xms256m -Xmx320m
      - SPRING_PROFILES_ACTIVE=local
      - SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR=Nacos:8848
      - SPRING_CLOUD_NACOS_CONFIG_NAMESPACE=
      - SPRING_CLOUD_NACOS_SERVER_ADDR=Nacos:8848
      - SPRING_CLOUD_NACOS_DISCOVERY_NAMESPACE=
      - SPRING_DATASOURCE_DYNAMIC_DATASOURCE_MASTER_URL=jdbc:postgresql://PostgresSQL:5432/iot-node20?autoReconnect=true&autoReconnectForPools=true&useUnicode=true&characterEncoding=utf8&createDatabaseIfNotExist=true&allowMultiQueries=true&zeroDateTimeBehavior=convertToNull&stringtype=unspecified
      - SPRING_REDIS_HOST=Redis
      # 容器内 iot-node 纳管控制面节点时使用宿主机 IP（避免探测到容器网桥地址）
      - EASYAIOT_PLATFORM_HOST=${EASYAIOT_PLATFORM_HOST:-${HOST_IP:-}}
      - EASYAIOT_AGENT_CONTROL_PLANE_URL=${EASYAIOT_AGENT_CONTROL_PLANE_URL:-}
      # 容器内媒体根固定为挂载点（与 volume 目标路径一致）
      - EASYAIOT_EDGE_MEDIA_ROOT=/mnt/easyaiot-media
      - EASYAIOT_MEDIA_CLUSTER_PATH=/opt/easyaiot/.scripts/media-cluster
      - EASYAIOT_STORAGE_CLUSTER_PATH=/opt/easyaiot/.scripts/media-cluster/nfs
      # 必须与主/边缘 VIDEO 一致，用于边缘资产上报及录像代理访问
      - MEDIA_INTERNAL_TOKEN=${MEDIA_INTERNAL_TOKEN:-}
    volumes:
      - ../.build-cache/device/node-logs:/root/logs/
      # Agent 源码目录（SENTINEL：含 install.sh / pip-wheels / get-pip.py 等，供控制面远程分发）
      - ../SENTINEL:/opt/easyaiot/SENTINEL
      - ../VIDEO:/opt/easyaiot/VIDEO
      # NFS 共享媒体根（控制面本机文件浏览与宿主机一致）
      - ${EASYAIOT_MEDIA_ROOT:-/mnt/easyaiot-media}:/mnt/easyaiot-media:rw
      # 媒体栈部署脚本源（SRS/ZLM/边缘录像代理及 NFS，同步到工作节点）
      - ../.scripts/media-cluster:/opt/easyaiot/.scripts/media-cluster:rw
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:48094/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: always
    networks:
      - easyaiot-network
    depends_on:
      iot-infra:
        condition: service_healthy

  iot-visualize:
    image: iot-module-visualize-biz:latest
    container_name: iot-visualize
    user: root
    environment:
      - TZ=Asia/Shanghai
      - JAVA_OPTS=-Xms256m -Xmx320m
      - SPRING_PROFILES_ACTIVE=local
      - SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR=Nacos:8848
      - SPRING_CLOUD_NACOS_CONFIG_NAMESPACE=
      - SPRING_CLOUD_NACOS_SERVER_ADDR=Nacos:8848
      - SPRING_CLOUD_NACOS_DISCOVERY_NAMESPACE=
      - SPRING_DATASOURCE_DYNAMIC_DATASOURCE_MASTER_URL=jdbc:postgresql://PostgresSQL:5432/iot-visualize20?autoReconnect=true&autoReconnectForPools=true&useUnicode=true&characterEncoding=utf8&createDatabaseIfNotExist=true&allowMultiQueries=true&zeroDateTimeBehavior=convertToNull&stringtype=unspecified
      - SPRING_REDIS_HOST=Redis
      - IOT_FUXA_BASE_URL=http://FUXA:1881
      - IOT_FUXA_PUBLIC_URL=http://127.0.0.1:1881
      - IOT_FUXA_USERNAME=admin
      - IOT_FUXA_PASSWORD=123456
    volumes:
      - ../.build-cache/device/visualize-logs:/root/logs/
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:48095/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: always
    networks:
      - easyaiot-network
    depends_on:
      iot-infra:
        condition: service_healthy

  # iot-flow（FLOW 工作流：告警处理责任到人，Flowable 6.8 + PG）
  iot-flow:
    image: iot-flow-biz:latest
    container_name: iot-flow
    user: root
    environment:
      - TZ=Asia/Shanghai # 配置程序默认时区为上海（中国标准时间）
      - JAVA_OPTS=-Xms256m -Xmx512m
      - SPRING_PROFILES_ACTIVE=local # 指定程序运行环境
      - SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR=Nacos:8848 # 配置中心地址（使用Docker服务名）
      - SPRING_CLOUD_NACOS_CONFIG_NAMESPACE= # 使用默认命名空间（public）
      - SPRING_CLOUD_NACOS_SERVER_ADDR=Nacos:8848 # 注册中心地址（使用Docker服务名）
      - SPRING_CLOUD_NACOS_DISCOVERY_NAMESPACE= # 使用默认命名空间（public）
      # master=flow 业务库（flow_alert_record 等业务表 + Flowable ACT_ 表）；system=只读用户/角色直查（候选人策略）
      - SPRING_DATASOURCE_DYNAMIC_DATASOURCE_MASTER_URL=jdbc:postgresql://PostgresSQL:5432/iot-flow20?autoReconnect=true&autoReconnectForPools=true&useUnicode=true&characterEncoding=utf8&createDatabaseIfNotExist=true&allowMultiQueries=true&zeroDateTimeBehavior=convertToNull&stringtype=unspecified
      - SPRING_DATASOURCE_DYNAMIC_DATASOURCE_SYSTEM_URL=jdbc:postgresql://PostgresSQL:5432/ruoyi-vue-pro20?stringtype=unspecified
      - SPRING_REDIS_HOST=Redis # Redis地址（使用Docker服务名）
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=Kafka:9092 # Kafka地址（告警创建事件消费）
    volumes:
      - ../.build-cache/device/logs:/root/logs/
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:48097/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: always
    networks:
      - easyaiot-network
    depends_on:
      iot-infra:
        condition: service_healthy

  # iot-tdengine（默认不启动；需 TDengine 时 docker compose --profile tdengine up）
  iot-tdengine:
    profiles: ["tdengine"]
    image: iot-module-tdengine-biz:latest
    container_name: iot-tdengine
    user: root
    environment:
      - TZ=Asia/Shanghai # 配置程序默认时区为上海（中国标准时间）
      - JAVA_OPTS=-Xms256m -Xmx320m
      - SPRING_PROFILES_ACTIVE=local # 指定程序运行环境
      - SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR=Nacos:8848 # 配置中心地址（使用Docker服务名）
      - SPRING_CLOUD_NACOS_CONFIG_NAMESPACE= # 使用默认命名空间（public）
      - SPRING_CLOUD_NACOS_SERVER_ADDR=Nacos:8848 # 注册中心地址（使用Docker服务名）
      - SPRING_CLOUD_NACOS_DISCOVERY_NAMESPACE= # 使用默认命名空间（public）
      - SPRING_DATASOURCE_DYNAMIC_DATASOURCE_MASTER_URL=jdbc:TAOS-RS://TDengine:6041/iot_device?user=root&password=taosdata&useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=GMT%2B8 # TDengine数据库地址（使用Docker服务名）
      - SPRING_REDIS_HOST=Redis # Redis地址（使用Docker服务名）
      # SkyWalking配置（如需要，请取消注释并配置）
      # - JAVA_TOOL_OPTIONS=-javaagent:/data/skywalking/skywalking-agent/skywalking-agent.jar
      # - SW_AGENT_NAME=iot-tdengine
      # - SW_AGENT_TRACE_IGNORE_PATH=Redisson/PING,/actuator/**,/admin/**
      # - SW_AGENT_COLLECTOR_BACKEND_SERVICES=[YOUR_SKYWALKING_ADDR]
    volumes:
      - ../.build-cache/device/logs:/root/logs/
      # - /data/skywalking/skywalking-agent:/data/skywalking/skywalking-agent
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:48091"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: always
    networks:
      - easyaiot-network
    depends_on:
      iot-infra:
        condition: service_healthy

  iot-file:
    image: iot-module-file-biz:latest
    container_name: iot-file
    user: root
    environment:
      - TZ=Asia/Shanghai # 配置程序默认时区为上海（中国标准时间）
      - JAVA_OPTS=-Xms256m -Xmx320m
      - SPRING_PROFILES_ACTIVE=local # 指定程序运行环境
      - SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR=Nacos:8848 # 配置中心地址（使用Docker服务名）
      - SPRING_CLOUD_NACOS_CONFIG_NAMESPACE= # 使用默认命名空间（public）
      - SPRING_CLOUD_NACOS_SERVER_ADDR=Nacos:8848 # 注册中心地址（使用Docker服务名）
      - SPRING_CLOUD_NACOS_DISCOVERY_NAMESPACE= # 使用默认命名空间（public）
      - SPRING_DATASOURCE_DYNAMIC_DATASOURCE_MASTER_URL=jdbc:postgresql://PostgresSQL:5432/ruoyi-vue-pro20?autoReconnect=true&autoReconnectForPools=true&useUnicode=true&characterEncoding=utf8&createDatabaseIfNotExist=true&allowMultiQueries=true&zeroDateTimeBehavior=convertToNull&stringtype=unspecified # PostgreSQL数据库地址（使用Docker服务名）
      - SPRING_REDIS_HOST=Redis # Redis地址（使用Docker服务名）
      - MINIO_URL=http://MinIO:9000 # Minio地址（使用Docker服务名）
      - MINIO_DOWNLOAD_URL=http://MinIO:9001 # Minio下载地址（使用Docker服务名）
      # SkyWalking配置（如需要，请取消注释并配置）
      # - JAVA_TOOL_OPTIONS=-javaagent:/data/skywalking/skywalking-agent/skywalking-agent.jar
      # - SW_AGENT_NAME=iot-file
      # - SW_AGENT_TRACE_IGNORE_PATH=Redisson/PING,/actuator/**,/admin/**
      # - SW_AGENT_COLLECTOR_BACKEND_SERVICES=[YOUR_SKYWALKING_ADDR]
    volumes:
      - ../.build-cache/device/logs:/root/logs/
      # - /data/skywalking/skywalking-agent:/data/skywalking/skywalking-agent
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:48090"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: always
    networks:
      - easyaiot-network
    depends_on:
      iot-infra:
        condition: service_healthy

  iot-message:
    image: iot-module-message-biz:latest
    container_name: iot-message
    user: root
    environment:
      - TZ=Asia/Shanghai # 配置程序默认时区为上海（中国标准时间）
      - JAVA_OPTS=-Xms256m -Xmx320m
      - SPRING_PROFILES_ACTIVE=local # 指定程序运行环境
      - SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR=Nacos:8848 # 配置中心地址（使用Docker服务名）
      - SPRING_CLOUD_NACOS_CONFIG_NAMESPACE= # 使用默认命名空间（public）
      - SPRING_CLOUD_NACOS_SERVER_ADDR=Nacos:8848 # 注册中心地址（使用Docker服务名）
      - SPRING_CLOUD_NACOS_DISCOVERY_NAMESPACE= # 使用默认命名空间（public）
      - SPRING_DATASOURCE_DYNAMIC_DATASOURCE_MASTER_URL=jdbc:postgresql://PostgresSQL:5432/iot-message20?autoReconnect=true&autoReconnectForPools=true&useUnicode=true&characterEncoding=utf8&createDatabaseIfNotExist=true&allowMultiQueries=true&zeroDateTimeBehavior=convertToNull&stringtype=unspecified # PostgreSQL数据库地址（使用Docker服务名）
      - SPRING_DATASOURCE_DYNAMIC_DATASOURCE_MASTER_USERNAME=postgres # PostgreSQL数据库用户名
      - SPRING_DATASOURCE_DYNAMIC_DATASOURCE_MASTER_PASSWORD=iot45722414822 # PostgreSQL数据库密码
      - SPRING_DATASOURCE_DYNAMIC_DATASOURCE_VIDEO_URL=jdbc:postgresql://PostgresSQL:5432/iot-video20?autoReconnect=true&autoReconnectForPools=true&useUnicode=true&characterEncoding=utf8&allowMultiQueries=true&zeroDateTimeBehavior=convertToNull&stringtype=unspecified # VIDEO数据库地址（使用Docker服务名）
      - SPRING_DATASOURCE_DYNAMIC_DATASOURCE_VIDEO_USERNAME=postgres # VIDEO数据库用户名
      - SPRING_DATASOURCE_DYNAMIC_DATASOURCE_VIDEO_PASSWORD=iot45722414822 # VIDEO数据库密码
      - SPRING_REDIS_HOST=Redis # Redis地址（使用Docker服务名）
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=Kafka:9092 # Kafka地址（使用Docker服务名）
      - MINIO_ENDPOINT=http://MinIO # Minio地址（使用Docker服务名）
      - MINIO_PORT=9000 # Minio端口
      # SkyWalking配置（如需要，请取消注释并配置）
      # - JAVA_TOOL_OPTIONS=-javaagent:/data/skywalking/skywalking-agent/skywalking-agent.jar
      # - SW_AGENT_NAME=iot-message
      # - SW_AGENT_TRACE_IGNORE_PATH=Redisson/PING,/actuator/**,/admin/**
      # - SW_AGENT_COLLECTOR_BACKEND_SERVICES=[YOUR_SKYWALKING_ADDR]
    volumes:
      - ../.build-cache/device/logs:/root/logs/
      # - /data/skywalking/skywalking-agent:/data/skywalking/skywalking-agent
    # 配置hosts映射，将kafka-server映射到宿主机IP
    # 使用host-gateway自动解析为宿主机IP（Docker 20.10+支持）
    # 如果host-gateway不工作，可以手动指定IP，例如：- "kafka-server:192.168.1.100"
    extra_hosts:
      - "kafka-server:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:48093"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: always
    networks:
      - easyaiot-network
    depends_on:
      iot-infra:
        condition: service_healthy

  iot-sink:
    image: iot-sink-biz:latest
    container_name: iot-sink
    user: root
    ports:
      - "0.0.0.0:48092:48092"
    environment:
      - TZ=Asia/Shanghai # 配置程序默认时区为上海（中国标准时间）
      - JAVA_OPTS=-Xms256m -Xmx320m
      - SPRING_PROFILES_ACTIVE=${IOT_SINK_SPRING_PROFILES_ACTIVE:-local} # mini/standard 形态由安装脚本追加 mini/standard profile（无 TDengine 时 tdengine 数据源 lazy）
      - SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR=Nacos:8848 # 配置中心地址（使用Docker服务名）
      - SPRING_CLOUD_NACOS_CONFIG_NAMESPACE= # 使用默认命名空间（public）
      - SPRING_CLOUD_NACOS_SERVER_ADDR=Nacos:8848 # 注册中心地址（使用Docker服务名）
      - SPRING_CLOUD_NACOS_DISCOVERY_NAMESPACE= # 使用默认命名空间（public）
      - SPRING_DATASOURCE_DYNAMIC_DATASOURCE_MASTER_URL=jdbc:postgresql://PostgresSQL:5432/iot-device20?autoReconnect=true&autoReconnectForPools=true&useUnicode=true&characterEncoding=utf8&createDatabaseIfNotExist=true&allowMultiQueries=true&zeroDateTimeBehavior=convertToNull&stringtype=unspecified # PostgreSQL数据库地址（使用Docker服务名）
      - SPRING_DATASOURCE_DYNAMIC_DATASOURCE_TDENGINE_URL=jdbc:TAOS-RS://TDengine:6041/iot_device?user=root&password=taosdata&useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=GMT%2B8 # TDengine数据库地址（使用Docker服务名）
      - SPRING_DATASOURCE_DYNAMIC_DATASOURCE_VIDEO_URL=jdbc:postgresql://PostgresSQL:5432/iot-video20?autoReconnect=true&autoReconnectForPools=true&useUnicode=true&characterEncoding=utf8&allowMultiQueries=true&zeroDateTimeBehavior=convertToNull&stringtype=unspecified # VIDEO数据库地址（使用Docker服务名）
      - SPRING_DATASOURCE_DYNAMIC_DATASOURCE_NODE_URL=jdbc:postgresql://PostgresSQL:5432/iot-node20?autoReconnect=true&autoReconnectForPools=true&useUnicode=true&characterEncoding=utf8&allowMultiQueries=true&zeroDateTimeBehavior=convertToNull&stringtype=unspecified # iot-node 数据库（后处理 Worker 地址解析）
      - SPRING_REDIS_HOST=Redis # Redis地址（使用Docker服务名）
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=Kafka:9092 # Kafka地址（使用Docker服务名，用于标准配置）
      - SPRING_KAFKA_IOT_PRODUCER_BOOTSTRAP_SERVERS=Kafka:9092 # Kafka生产者地址（使用Docker服务名，用于自定义iot配置）
      - SPRING_KAFKA_IOT_CONSUMER_BOOTSTRAP_SERVERS=Kafka:9092 # Kafka消费者地址（使用Docker服务名，用于自定义iot配置）
      - BASICLAB_IOT_SINK_PROTOCOL_EMQX_MQTT_HOST=${IOT_SINK_EMQX_MQTT_HOST:-emqx-server} # EMQX Broker 地址（默认使用Docker容器名，可按服务器覆盖）
      - BASICLAB_IOT_SINK_PROTOCOL_EMQX_MQTT_TOPICS=/iot/#,/shadow/#,$$share/algo-sink/mqtt/iot-alert-notification,$$share/algo-sink/mqtt/iot-snapshot-alert,$$share/algo-sink/mqtt/iot-post-process-request # 算法总线仅使用共享订阅，避免重复消费
      - MINIO_URL=http://MinIO:9000 # Minio地址（使用Docker服务名）
      - MINIO_DOWNLOAD_URL=http://MinIO:9001 # Minio下载地址（使用Docker服务名）
      - MINIO_ACCESS_KEY=minioadmin # Minio访问密钥
      - MINIO_SECRET_KEY=basiclab@iot975248395 # Minio秘密密钥
      # NFS 共享媒体（容器内固定挂载点 /mnt/easyaiot-media，与 volume 目标路径一致）
      - BASICLAB_MEDIA_MOUNT_ROOT=/mnt/easyaiot-media
      - ALERT_IMAGES_BASE_DIR=/mnt/easyaiot-media/alert_images
      # 与 SRS dvr_duration 保持一致；Hook 未携带时长且 ffprobe 不可用时仅作为兜底
      - SINK_DVR_DEFAULT_DURATION_SECONDS=${SRS_DVR_DURATION_SECONDS:-30}
      # VIDEO/Gateway 服务地址：iot-gateway 为 host 网络，容器内 localhost 指向自身，
      # 必须用 easyaiot-network 网关（宿主机）地址，否则人脸匹配/告警回调 Connection refused
      - BASICLAB_VIDEO_SERVICE_URL=${BASICLAB_VIDEO_SERVICE_URL:-http://172.18.0.1:48080}
      # SkyWalking配置（如需要，请取消注释并配置）
      # - JAVA_TOOL_OPTIONS=-javaagent:/data/skywalking/skywalking-agent/skywalking-agent.jar
      # - SW_AGENT_NAME=iot-sink
      # - SW_AGENT_TRACE_IGNORE_PATH=Redisson/PING,/actuator/**,/admin/**
      # - SW_AGENT_COLLECTOR_BACKEND_SERVICES=[YOUR_SKYWALKING_ADDR]
    volumes:
      - ../.build-cache/device/logs:/root/logs/
      # NFS 共享媒体根（唯一存储；与 VIDEO ALERT_IMAGES_DIR / playbacks 一致）
      - ${EASYAIOT_MEDIA_ROOT:-/mnt/easyaiot-media}:/mnt/easyaiot-media:rw
      # full 形态工业协议演示：宿主机 /tmp 虚拟串口 + pts（.scripts/modbus-rtu-virtual-serial）
      - /tmp:/tmp
      - /dev/pts:/dev/pts
      # - /data/skywalking/skywalking-agent:/data/skywalking/skywalking-agent
    # 配置hosts映射，将kafka-server映射到宿主机IP
    # 使用host-gateway自动解析为宿主机IP（Docker 20.10+支持）
    # 如果host-gateway不工作，可以手动指定IP，例如：- "kafka-server:192.168.1.100"
    # host.docker.internal：Sink 访问宿主机 Modbus TCP(5020) / OPC UA(4840) 演示从站
    extra_hosts:
      - "kafka-server:host-gateway"
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:48092/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: always
    networks:
      - easyaiot-network
    depends_on:
      iot-system:
        condition: service_healthy

  iot-gb28181:
    image: iot-gb28181-biz:latest
    container_name: iot-gb28181
    user: root
    network_mode: host # 使用host网络模式，直接使用宿主机网络（GB28181需要直接访问网络）
    environment:
      - TZ=Asia/Shanghai # 配置程序默认时区为上海（中国标准时间）
      - JAVA_OPTS=-Xms256m -Xmx320m
      - SPRING_PROFILES_ACTIVE=local # 指定程序运行环境
      - SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR=localhost:8848 # 配置中心地址（使用host网络模式，通过localhost访问）
      - SPRING_CLOUD_NACOS_CONFIG_NAMESPACE= # 使用默认命名空间（public）
      - SPRING_CLOUD_NACOS_SERVER_ADDR=localhost:8848 # 注册中心地址（使用host网络模式，通过localhost访问）
      - SPRING_CLOUD_NACOS_DISCOVERY_NAMESPACE= # 使用默认命名空间（public）
      - SPRING_DATASOURCE_DYNAMIC_DATASOURCE_MASTER_URL=jdbc:postgresql://PostgresSQL:5432/iot-gb2818120?autoReconnect=true&autoReconnectForPools=true&useUnicode=true&characterEncoding=utf8&createDatabaseIfNotExist=true&allowMultiQueries=true&zeroDateTimeBehavior=convertToNull&stringtype=unspecified # PostgreSQL数据库地址（使用Docker服务名，通过extra_hosts映射）
      - SPRING_REDIS_HOST=Redis # Redis地址（使用Docker服务名，通过extra_hosts映射）
      # SkyWalking配置（如需要，请取消注释并配置）
      # - JAVA_TOOL_OPTIONS=-javaagent:/data/skywalking/skywalking-agent/skywalking-agent.jar
      # - SW_AGENT_NAME=iot-gb28181
      # - SW_AGENT_TRACE_IGNORE_PATH=Redisson/PING,/actuator/**,/admin/**
      # - SW_AGENT_COLLECTOR_BACKEND_SERVICES=[YOUR_SKYWALKING_ADDR]
    volumes:
      - ../.build-cache/device/logs:/root/logs/
      # - /data/skywalking/skywalking-agent:/data/skywalking/skywalking-agent
    # 配置hosts映射，将PostgresSQL和Redis映射到宿主机IP（使用host-gateway自动解析为宿主机IP）
    # 这样使用host网络模式的服务可以通过服务名访问Docker网络中的服务
    extra_hosts:
      - "PostgresSQL:host-gateway"
      - "Redis:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:48088/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: always

networks:
  easyaiot-network:
    name: easyaiot-network
    external: true
