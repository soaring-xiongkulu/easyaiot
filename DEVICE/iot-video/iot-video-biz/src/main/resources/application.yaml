spring:
  main:
    allow-circular-references: true
  mvc:
    pathmatch:
      matching-strategy: ANT_PATH_MATCHER

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
  health:
    db:
      enabled: true

video:
  alert:
    use-direct-persist: true
  runtime:
    config-dir: ${user.home}/.video-java/runtime-config
    logs-dir: ${user.home}/.video-java/logs
    repo-root: ${ACME_ROOT:${RUNTIME_ROOT:}}
