spring:
  main:
    allow-circular-references: true
  mvc:
    pathmatch:
      matching-strategy: ANT_PATH_MATCHER

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
  health:
    db:
      enabled: true

video:
  skip-background-tasks: false
  health-monitor:
    enabled: true
    interval-ms: 60000
    heartbeat-failover-seconds: 90
  stream-forward-health:
    enabled: true
    interval-ms: 60000
  space-cleanup:
    enabled: true
    interval-ms: 1800000
  playback-disk-guard:
    enabled: true
    interval-ms: 600000
    max-age-hours: 1
    device-max-files: 30
    global-max-files: 2000
    keep-ratio: 0.2
    disk-warn-percent: 80
    disk-critical-percent: 90
    disk-target-percent: 75
    emergency-batch-size: 50
    emergency-max-rounds: 200
  media-janitor:
    enabled: true
    interval-ms: 60000
    orphan-min-age-minutes: 10
  # Commercial / full local-stack defaults (not mini/certify shortcuts).
  # Shortcuts (direct persist / stub enqueue / sync upload / MinIO off) only via profile mini or explicit env.
  alert:
    use-direct-persist: false
    alert-notification-topic: iot-alert-notification
    snapshot-alert-topic: iot-snapshot-alert
  kafka:
    bootstrap-servers: localhost:9092
    client-id: video-alert-producer
    request-timeout-ms: 30000
    retries: 3
    max-block-ms: 60000
    send-timeout-ms: 10000
  matching:
    use-direct-process: false
  inference:
    enabled: true
    timeout-seconds: 120
  post-process:
    use-stub-enqueue: false
    workspace-root: ${user.home}/.video-java/post-process-workspaces
    sink-host: 127.0.0.1
    sink-port: "48092"
    sink-use-gateway: false
    gateway-url: http://localhost:48080
    enqueue-timeout-ms: 5000
  runtime:
    config-dir: ${user.home}/.video-java/runtime-config
    logs-dir: ${user.home}/.video-java/logs
    repo-root: ${ACME_ROOT:${RUNTIME_ROOT:}}
  media:
    # sync | kafka | hybrid — commercial default kafka (Python non-mini / cluster)
    upload-mode: kafka
    dvr-completed-topic: media.dvr.completed
    dvr-dlq-topic: media.dvr.dlq
    dvr-consumer-group: upload-worker-dvr
    dvr-max-retries: 12
    dvr-poll-timeout-ms: 1000
    snap-completed-topic: media.snap.completed
    snap-dlq-topic: media.snap.dlq
    snap-consumer-group: upload-worker-snap
    snap-max-retries: 8
    snap-poll-timeout-ms: 1000
  minio:
    enabled: true
    endpoint: http://localhost:9000
