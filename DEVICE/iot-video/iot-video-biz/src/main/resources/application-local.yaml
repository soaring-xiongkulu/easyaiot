debug: false

spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://127.0.0.1:15432/iot-video20?autoReconnect=true&useUnicode=true&characterEncoding=utf8&stringtype=unspecified
    username: postgres
    password: iot45722414822

management:
  health:
    db:
      enabled: false

video:
  # Daily candidate = commercial / full local stack (bootstrap.yaml active: local).
  # Do NOT re-enable direct/stub/sync shortcuts here; use profile mini or explicit env for certify.
  skip-background-tasks: false
  health-monitor:
    interval-ms: 5000
  alert:
    use-direct-persist: false
    alert-notification-topic: iot-alert-notification
    snapshot-alert-topic: iot-snapshot-alert
  kafka:
    bootstrap-servers: 127.0.0.1:9092
  matching:
    use-direct-process: false
  post-process:
    use-stub-enqueue: false
    java-rules-enabled: true
    workspace-root: ${user.home}/.video-java/post-process-workspaces
    rules-dir: ${user.home}/.video-java/post-process-workspaces/rules
    sink-host: 127.0.0.1
    sink-port: "48092"
    sink-use-gateway: false
    gateway-url: http://localhost:48080
    enqueue-timeout-ms: 5000
  media:
    upload-mode: kafka
  minio:
    enabled: true
    endpoint: http://127.0.0.1:9000
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
  ffmpeg-path: F:/biofactory/ResearchStudioInstall/tools/bin/ffmpeg.cmd
  runtime:
    # Candidate worktree root (RUNTIME + DEVICE/iot-video/models live here).
    repo-root: F:/acme/.worktrees/video-java
  inference:
    enabled: true
    python-cli-enabled: false
    onnx-enabled: true
    models-dir: F:/acme/.worktrees/video-java/DEVICE/iot-video/models
    face-rec-model-path: F:/acme/.worktrees/video-java/DEVICE/iot-video/models/face_rec.onnx
    face-det-model-path: F:/acme/.worktrees/video-java/DEVICE/iot-video/models/face_det.onnx
    plate-detect-model-path: F:/acme/.worktrees/video-java/DEVICE/iot-video/models/plate_detect.onnx
    plate-rec-model-path: F:/acme/.worktrees/video-java/DEVICE/iot-video/models/plate_rec.onnx
    pose-model-path: F:/acme/.worktrees/video-java/DEVICE/iot-video/models/yolo26n-pose.onnx
    milvus-uri: http://127.0.0.1:19530
    face-milvus-collection: face_embeddings
    face-similarity-threshold: 0.55
    timeout-seconds: 120
