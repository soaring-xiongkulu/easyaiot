spring:
  main:
    allow-circular-references: true
    allow-bean-definition-overriding: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB
  mvc:
    pathmatch:
      matching-strategy: ANT_PATH_MATCHER
  jackson:
    serialization:
      write-dates-as-timestamps: true
      write-date-timestamps-as-nanoseconds: false
      write-durations-as-timestamps: true
      fail-on-empty-beans: false
  cache:
    type: REDIS
    redis:
      time-to-live: 1h
  data:
    redis:
      repositories:
        enabled: false

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
  default-flat-param-object: true

knife4j:
  enable: true
  setting:
    language: zh_cn

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: NONE
      logic-delete-value: 1
      logic-not-delete-value: 0
    banner: false
  type-aliases-package: ${iot.info.base-package}.dal.dataobject
  encryptor:
    password: XDV71a+xqStEA3WH

mybatis-plus-join:
  banner: false

iot:
  info:
    version: 1.0.0
    base-package: com.basiclab.iot.node
  web:
    admin-ui:
      url: http://dashboard.iot.iocoder.cn
  swagger:
    title: 管理后台
    description: 服务器节点管理
    version: ${iot.info.version}
    base-package: ${iot.info.base-package}
  captcha:
    enable: true
  tenant:
    enable: true
    ignore-urls:
      - /node/agent/**
      - /node/edge/**
      - /node/ws/**
      - /node/platform-agent-bootstrap
      - /node/control-plane/snapshot
      - /node/control-plane/peer/register
    ignore-tables:
      - compute_node
      - edge_node
      - node_ssh_credential
      - node_metric_snapshot
      - node_workload_binding
      - device_media_binding
      - control_plane_peer
      - node_storage_op_log
      - nfs_cluster
      - nfs_cluster_bridge
      - node_sentinel_snapshot
      - node_sentinel_remediate_log

easyaiot:
  scheduler:
    # 自动调度时是否优先选择 GPU 节点（可被单次 allocate 请求的 preferGpu 覆盖）
    prefer-gpu-default: ${EASYAIOT_SCHEDULER_PREFER_GPU:true}
  storage:
    # NFS 定时巡检（SSH 刷新现状并写 op_log）
    nfs-probe-enabled: ${EASYAIOT_NFS_PROBE_ENABLED:true}
    nfs-probe-interval-ms: ${EASYAIOT_NFS_PROBE_INTERVAL_MS:900000}
    cluster-source-path: ${EASYAIOT_STORAGE_CLUSTER_PATH:}
    # IDEA/宿主机本地启动：自动创建媒体目录 + 尽量拉起本机 NFS，并为控制面补齐主角色
    local-nfs-bootstrap: ${EASYAIOT_LOCAL_NFS_BOOTSTRAP:true}
  media:
    cluster-source-path: ${EASYAIOT_MEDIA_CLUSTER_PATH:}
    # Hook 回调目标（SRS/ZLM on_publish 等）；默认自动探测，无需手动配置
    # 优先级：EASYAIOT_AGENT_CONTROL_PLANE_URL → 非回环 EASYAIOT_MEDIA_HOOK_HOST → 平台节点 IP → 宿主机 IP 探测
    hook-host: ${EASYAIOT_MEDIA_HOOK_HOST:127.0.0.1}
    hook-port: ${EASYAIOT_MEDIA_HOOK_PORT:48080}
  video:
    # VIDEO 源码目录（推流/算法远程部署 SSH 同步源）；未设置时自动探测
    source-path: ${EASYAIOT_VIDEO_SOURCE_PATH:}
    remote-root: ${EASYAIOT_VIDEO_REMOTE_ROOT:/opt/easyaiot/VIDEO}
    auto-sync-before-deploy: ${EASYAIOT_VIDEO_AUTO_SYNC:true}
  ai:
    # AI 源码目录（模型服务远程部署 SSH 同步源）；未设置时自动探测
    source-path: ${EASYAIOT_AI_SOURCE_PATH:}
    remote-root: ${EASYAIOT_AI_REMOTE_ROOT:/opt/easyaiot/AI}
    auto-sync-before-deploy: ${EASYAIOT_AI_AUTO_SYNC:true}
  agent:
    # Agent 源码目录（含 export_pip_wheels.sh）；未设置时自动探测 repo/SENTINEL
    source-path: ${EASYAIOT_AGENT_SOURCE_PATH:}
    # 可选：显式指定控制面 URL；留空则与 media.hook-host 同样自动探测
    control-plane-url: ${EASYAIOT_AGENT_CONTROL_PLANE_URL:}
  sentinel:
    enabled: ${EASYAIOT_SENTINEL_ENABLED:true}
    scheduling-enabled: ${EASYAIOT_SENTINEL_SCHEDULING_ENABLED:true}
    # 节点纳管（含 SSH）完成后自动下发全量 Sentinel 离线包并启动监测
    auto-deploy-on-create: ${EASYAIOT_SENTINEL_AUTO_DEPLOY:true}
    # 控制面兜底：快照过期时主动触发节点 L1 探测
    probe-stale-enabled: ${EASYAIOT_SENTINEL_PROBE_STALE:true}
    probe-stale-interval-ms: ${EASYAIOT_SENTINEL_PROBE_STALE_MS:180000}
    resource-degrade-cpu-percent: ${EASYAIOT_SENTINEL_DEGRADE_CPU:85}
    resource-degrade-mem-percent: ${EASYAIOT_SENTINEL_DEGRADE_MEM:95}
  edge:
    # EDGE 模块自助纳管：生产请设置 join-token，并关闭开放纳管
    join-token: ${EASYAIOT_EDGE_JOIN_TOKEN:}
    allow-open-enroll: ${EASYAIOT_EDGE_ALLOW_OPEN_ENROLL:true}
    mqtt-algo-tenant: ${EASYAIOT_EDGE_MQTT_TENANT:default}
    media-host-data-root: ${EASYAIOT_EDGE_MEDIA_ROOT:/mnt/easyaiot-media}
    # 下发给 EDGE 的控制面公网/内网可达地址；留空则用本机 server.port
    control-plane-public-url: ${EASYAIOT_EDGE_CONTROL_PLANE_URL:}

debug: false
